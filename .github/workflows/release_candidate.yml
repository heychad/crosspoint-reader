name: Compile Release Candidate

on:
  workflow_dispatch:
    inputs:
      test_version:
        description: 'Test version without the device suffix, e.g. 2.0.0-chad.3-test66'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-release-candidate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pio_env: x4pro-chad-test
            asset: firmware-x4pro.bin
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Validate test version
        env:
          TEST_VERSION: ${{ inputs.test_version }}
        run: |
          set -euo pipefail
          if [[ ! "$TEST_VERSION" =~ ^([0-9]{1,9}\.[0-9]{1,9}\.[0-9]{1,9}-chad\.[0-9]{1,9})-test[0-9]{1,9}(-[a-z0-9]+)*$ ]] ||
             [[ "$TEST_VERSION" == *-x4pro ]] || (( ${#TEST_VERSION} > 58 )); then
            echo 'Enter a numbered personal test version without the -x4pro suffix.' >&2
            exit 1
          fi
          release_base="${BASH_REMATCH[1]}"
          configured_version="$(sed -n 's/^version = //p' platformio.ini | head -n1)"
          if [[ "$configured_version" != "$release_base" && "$configured_version" != "$release_base"-test* ]]; then
            echo 'Test version must use the release number in platformio.ini.' >&2
            exit 1
          fi
          printf 'CROSSPOINT_X4PRO_TEST_VERSION=%s\n' "$TEST_VERSION" >> "$GITHUB_ENV"
          printf 'SHORT_SHA=%s\n' "${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-v2-${{ runner.os }}-${{ hashFiles('platformio.ini', 'scripts/patch_pioarduino_cache.py') }}
          restore-keys: pio-v2-${{ runner.os }}-

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # Envs with custom_sdkconfig run a nested `pio run` from
          # ~/.platformio/penv. Keep that core on the same version as the outer core.
          # See https://github.com/pioarduino/platform-espressif32/issues/529
          pio pkg install -e ${{ matrix.pio_env }}
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build CrossPoint Release Candidate
        run: pio run -e ${{ matrix.pio_env }} -j1

      - name: Verify and name candidate asset
        env:
          PIO_ENV: ${{ matrix.pio_env }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          sdk_revision="$(git rev-parse HEAD:freeink-sdk)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C freeink-sdk rev-parse HEAD)" = "$sdk_revision"
          build=".pio/build/$PIO_ENV"
          version="${CROSSPOINT_X4PRO_TEST_VERSION}-x4pro"
          checksum="$(python3 scripts/check_x4pro_firmware.py "$build/firmware.bin" "$version")"
          cp "$build/firmware.bin" "$build/$ASSET"
          printf '%s  %s\n' "$checksum" "$ASSET" > "$build/SHA256SUMS"
          printf 'Commit: %s\nFreeInk SDK: %s\nProfile: %s\nVersion: %s\n' \
            "$GITHUB_SHA" "$sdk_revision" "$PIO_ENV" "$version" > "$build/SOURCE.txt"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: CrossPoint-${{ inputs.test_version }}-${{ env.SHORT_SHA }}-x4pro
          if-no-files-found: error
          path: |
            .pio/build/${{ matrix.pio_env }}/bootloader.bin
            .pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}
            .pio/build/${{ matrix.pio_env }}/firmware.elf
            .pio/build/${{ matrix.pio_env }}/firmware.map
            .pio/build/${{ matrix.pio_env }}/partitions.bin
            .pio/build/${{ matrix.pio_env }}/SHA256SUMS
            .pio/build/${{ matrix.pio_env }}/SOURCE.txt
